[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trendcut"
version = "0.1.0"
description = "Self-hosted TDEE & cut tracker that estimates real maintenance calories from logged intake and weight, smooths the scale into a trend, and detects genuine plateaus."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "James" }]
# NOTE: the estimator package itself imports only numpy. fastapi/uvicorn are used
# solely by the api package (the web/storage layer); estimator/ stays framework-free.
dependencies = [
    "numpy",
    "fastapi",
    "uvicorn",
    "argon2-cffi",  # password hashing (argon2id) for the auth layer
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "hypothesis",
    "httpx",  # required by fastapi/starlette TestClient
]

[tool.hatch.build.targets.wheel]
packages = ["estimator", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts ``Depends(...)`` in argument defaults
# on purpose; it is not the mutable-default footgun B008 targets.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
