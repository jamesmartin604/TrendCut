name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest

      # Print the estimator's measured CI calibration into the build log every run.
      # The assertions live in tests/test_ci_coverage.py; this step only makes the
      # number visible, since pytest hides stdout for passing tests. It is a known,
      # documented gap (PRD §7.3) — surfaced rather than buried.
      - name: TDEE confidence-interval calibration (report only)
        run: python -m tests.test_ci_coverage

      # Frontend pure-logic tests via Node's BUILT-IN test runner — no npm install,
      # no framework, no build step (web/package.json is just a `type: module`
      # marker so Node can import the existing ES-module files).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend logic tests (node --test)
        run: node --test
        working-directory: web

  # Deploy runs ONLY on a push to main, and ONLY after lint-and-test succeeds
  # (`needs:` makes a red lint/test result block the deploy entirely). Pull
  # requests and pushes to other branches still run lint-and-test above but never
  # reach this job.
  deploy:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-main  # never run two deploys at once
    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # FLY_API_TOKEN is a repository secret you populate in the GitHub UI
      # (Settings -> Secrets and variables -> Actions). Generate it with
      # `fly tokens create deploy`. It is never committed to the repo.
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
