<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendCut · Choose a new password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/app.css" />
  <script type="module" src="/js/reset.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">TrendCut</span>
    </div>
  </header>

  <main class="page auth-page">
    <form class="card auth-card" id="reset-form">
      <div>
        <h1 class="auth-title">Choose a new password</h1>
        <p class="auth-subtitle">Set a new password for your account.</p>
      </div>

      <div>
        <label class="field-label" for="password">New password</label>
        <div class="field-box">
          <input
            class="field-input"
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      <div>
        <label class="field-label" for="confirm">Confirm new password</label>
        <div class="field-box">
          <input
            class="field-input"
            id="confirm"
            name="confirm"
            type="password"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      <div class="form-error" id="reset-error" hidden></div>

      <button class="btn btn-primary" id="reset-submit" type="submit">Set new password</button>

      <p class="auth-alt"><a href="/login.html">Back to sign in</a></p>
    </form>
  </main>
</body>
</html>
