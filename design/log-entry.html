<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TrendCut | Log Entry</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#d8e2ff",
                    "border-hairline": "#E5E5E5",
                    "on-tertiary-container": "#fffbff",
                    "status-error": "#EF4444",
                    "primary-container": "#2170e4",
                    "surface-bright": "#f9f9f9",
                    "on-error-container": "#93000a",
                    "error-container": "#ffdad6",
                    "tertiary-fixed": "#ffdcc6",
                    "surface-container-highest": "#e2e2e2",
                    "on-secondary-fixed-variant": "#005236",
                    "secondary": "#006c49",
                    "surface-container-high": "#e8e8e8",
                    "on-background": "#1a1c1c",
                    "surface-container-low": "#f3f3f3",
                    "on-primary-fixed": "#001a42",
                    "outline-variant": "#c2c6d6",
                    "on-surface-variant": "#424754",
                    "background": "#f9f9f9",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#723600",
                    "on-primary": "#ffffff",
                    "on-secondary-container": "#00714d",
                    "on-primary-container": "#fefcff",
                    "on-error": "#ffffff",
                    "on-surface": "#1a1c1c",
                    "surface-variant": "#e2e2e2",
                    "surface-dim": "#dadada",
                    "status-warning": "#F59E0B",
                    "surface-container-lowest": "#ffffff",
                    "secondary-fixed": "#6ffbbe",
                    "on-secondary-fixed": "#002113",
                    "surface-tint": "#005ac2",
                    "secondary-container": "#6cf8bb",
                    "on-secondary": "#ffffff",
                    "text-muted": "#737373",
                    "inverse-on-surface": "#f0f1f1",
                    "outline": "#727785",
                    "tertiary-fixed-dim": "#ffb786",
                    "inverse-primary": "#adc6ff",
                    "surface": "#FFFFFF",
                    "error": "#ba1a1a",
                    "on-primary-fixed-variant": "#004395",
                    "secondary-fixed-dim": "#4edea3",
                    "surface-container": "#eeeeee",
                    "primary-fixed-dim": "#adc6ff",
                    "inverse-surface": "#2f3131",
                    "tertiary": "#924700",
                    "primary": "#0058be",
                    "data-fill": "rgba(59, 130, 246, 0.08)",
                    "on-tertiary-fixed": "#311400",
                    "tertiary-container": "#b75b00"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "section-margin": "40px",
                    "stack-gap": "16px",
                    "gutter": "20px",
                    "container-padding": "24px"
            },
            "fontFamily": {
                    "data-display": ["JetBrains Mono"],
                    "label-xs-mono": ["JetBrains Mono"],
                    "label-sm": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "data-display": ["28px", {"lineHeight": "36px", "fontWeight": "500"}],
                    "label-xs-mono": ["11px", {"lineHeight": "14px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #FAFAFA;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .backdrop-blur-custom {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="font-body-md text-on-surface">
<!-- Dashboard Background Layer (Simulated) -->
<div class="fixed inset-0 z-0 bg-background overflow-hidden p-container-padding flex flex-col gap-section-margin">
<!-- Top App Bar Mock -->
<header class="fixed top-0 left-0 right-0 h-16 bg-surface/80 backdrop-blur-md border-b border-border-hairline z-50">
<div class="max-w-[1200px] mx-auto px-container-padding h-full flex justify-between items-center">
<span class="font-headline-md text-headline-md font-bold text-on-surface">TrendCut</span>
<div class="flex items-center gap-stack-gap">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
<span class="material-symbols-outlined text-on-surface-variant">account_circle</span>
</div>
</div>
</header>
<!-- Mock Content for Depth -->
<main class="max-w-[1200px] mx-auto w-full mt-20 opacity-30 grayscale blur-[2px] pointer-events-none select-none">
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap">
<div class="bg-surface border border-border-hairline rounded-[20px] p-container-padding h-64 flex flex-col justify-end">
<div class="font-label-sm text-label-sm text-text-muted mb-2 uppercase">Weight Trend</div>
<div class="font-headline-lg text-headline-lg">74.2<span class="font-label-xs-mono text-label-xs-mono ml-1">kg</span></div>
</div>
<div class="bg-surface border border-border-hairline rounded-[20px] p-container-padding h-64 flex flex-col justify-end">
<div class="font-label-sm text-label-sm text-text-muted mb-2 uppercase">Caloric Average</div>
<div class="font-headline-lg text-headline-lg">2,450<span class="font-label-xs-mono text-label-xs-mono ml-1">kcal</span></div>
</div>
</div>
</main>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-on-background/10 backdrop-blur-custom transition-opacity duration-300" id="modal-overlay">
<!-- Modal Container -->
<div aria-modal="true" class="w-full max-w-[480px] mx-container-padding bg-surface rounded-[20px] shadow-[0px_4px_40px_rgba(0,0,0,0.06)] border border-border-hairline overflow-hidden transform transition-all duration-300 scale-100 opacity-100" role="dialog">
<!-- Modal Header -->
<div class="px-container-padding pt-container-padding pb-4 flex justify-between items-start">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">New Entry</h2>
<p class="font-label-sm text-label-sm text-text-muted mt-1">Consistency is the precursor to change.</p>
</div>
<button aria-label="Close modal" class="p-2 -mr-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95" onclick="closeModal()">
<span class="material-symbols-outlined text-outline">close</span>
</button>
</div>
<!-- Modal Content / Form -->
<form class="px-container-padding pb-container-padding space-y-8" id="log-form">
<!-- Date Selector (Pre-filled) -->
<div class="group">
<label class="block font-label-sm text-label-sm text-text-muted uppercase mb-2 tracking-wider" for="entry-date">Date</label>
<div class="relative border-b border-border-hairline focus-within:border-primary transition-colors py-2 flex items-center">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface" id="entry-date" type="date" value="2024-05-24"/>
<span class="material-symbols-outlined text-outline text-[20px] pointer-events-none">calendar_today</span>
</div>
</div>
<!-- Metrics Grid -->
<div class="grid grid-cols-2 gap-stack-gap">
<!-- Body Weight -->
<div class="group">
<label class="block font-label-sm text-label-sm text-text-muted uppercase mb-2 tracking-wider" for="body-weight">Weight</label>
<div class="relative border-b border-border-hairline focus-within:border-primary transition-colors py-2 flex items-end">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-headline-lg text-headline-lg text-on-surface placeholder:text-surface-container-highest" id="body-weight" placeholder="00.0" step="0.1" type="number"/>
<span class="font-label-xs-mono text-label-xs-mono text-text-muted mb-2 ml-1">kg</span>
</div>
</div>
<!-- Total Calories -->
<div class="group">
<label class="block font-label-sm text-label-sm text-text-muted uppercase mb-2 tracking-wider" for="total-calories">Calories</label>
<div class="relative border-b border-border-hairline focus-within:border-primary transition-colors py-2 flex items-end">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-headline-lg text-headline-lg text-on-surface placeholder:text-surface-container-highest" id="total-calories" placeholder="0000" type="number"/>
<span class="font-label-xs-mono text-label-xs-mono text-text-muted mb-2 ml-1">kcal</span>
</div>
</div>
</div>
<!-- Notes (Optional) -->
<div class="group">
<label class="block font-label-sm text-label-sm text-text-muted uppercase mb-2 tracking-wider" for="entry-notes">Notes</label>
<div class="border-b border-border-hairline focus-within:border-primary transition-colors py-2">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="entry-notes" placeholder="Optional context..." type="text"/>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row-reverse gap-4 pt-4">
<button class="w-full sm:w-auto px-8 h-12 bg-primary text-on-primary rounded-full font-label-sm text-label-sm font-semibold active:scale-95 transition-all shadow-sm hover:shadow-md hover:bg-on-primary-fixed-variant" type="submit">
                        Save Entry
                    </button>
<button class="w-full sm:w-auto px-8 h-12 bg-surface text-on-surface-variant rounded-full font-label-sm text-label-sm font-semibold border border-border-hairline hover:bg-surface-container-low active:scale-95 transition-all" onclick="closeModal()" type="button">
                        Cancel
                    </button>
</div>
</form>
</div>
</div>
<!-- Micro-interaction Scripts -->
<script>
        // Set today's date automatically
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('entry-date');
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;

            // Simple reveal animation
            const modal = document.querySelector('[role="dialog"]');
            modal.style.opacity = '0';
            modal.style.transform = 'scale(0.95) translateY(10px)';
            
            setTimeout(() => {
                modal.style.transition = 'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
                modal.style.opacity = '1';
                modal.style.transform = 'scale(1) translateY(0)';
            }, 100);
        });

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const modal = overlay.querySelector('[role="dialog"]');
            
            modal.style.opacity = '0';
            modal.style.transform = 'scale(0.95) translateY(10px)';
            overlay.style.opacity = '0';
            
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 400);
        }

        document.getElementById('log-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Success animation or feedback could go here
            const saveBtn = e.target.querySelector('button[type="submit"]');
            saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
            saveBtn.disabled = true;
            
            setTimeout(() => {
                saveBtn.innerHTML = 'Saved';
                saveBtn.classList.remove('bg-primary');
                saveBtn.classList.add('bg-secondary');
                setTimeout(closeModal, 600);
            }, 800);
        });

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Close modal on backdrop click
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal-overlay')) closeModal();
        });
    </script>
</body></html>
